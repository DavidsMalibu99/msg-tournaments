<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NYOT Scoring Table</title>
<style>
:root{--bg:#f4f1e6;--card:#fff;--ink:#1c2b2b;--green:#1d7a3c;--teal:#0d7377;--red:#b3202a;--muted:#66736b;--line:#ddd6c3;--warn:#fff3c4;--ok:#e3f2e6}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
header{background:var(--green);color:#fff;padding:14px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}
header a{color:#fff;font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:18px;margin:6px 0 10px;color:var(--green)}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
input,select,button{font:inherit}
input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;padding:10px;border:1px solid #bfb8a5;border-radius:8px;background:#fff}
input[type=number]{text-align:center;font-size:20px;font-weight:700}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e8c35a;outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:#fff;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#fff}
.team{display:grid;grid-template-columns:44px minmax(0,1fr) 84px auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.team:first-child{border-top:0}
.hole{font-weight:800;color:#fff;background:var(--green);border-radius:8px;text-align:center;padding:6px 0;font-size:15px;line-height:1.1}
.hole small{display:block;font-size:10px;font-weight:700;opacity:.85}
.t2 .hole{background:var(--teal)}
.who b{display:block}
.who span{font-size:13px;color:var(--muted)}
.team.posted{background:var(--ok);margin:0 -14px;padding:10px 14px}
.team.tie{background:var(--warn);margin:0 -14px;padding:10px 14px}
.tb{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end}
.tb input{font-size:16px;padding:8px}
.note{font-size:13px;color:#7a5b00;grid-column:2/-1}
.ctprow{display:grid;grid-template-columns:44px minmax(0,1fr) 64px 64px auto;gap:8px;align-items:end;border-top:1px solid var(--line);padding:9px 0}
.ctprow:first-child{border-top:0}
.ctprow input[type=number]{font-size:16px;padding:9px 4px}
.msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.msg.show{opacity:1}.msg.bad{background:var(--red)}
.muted{color:var(--muted);font-size:14px}
[hidden]{display:none!important}
@media (max-width:560px){.team{grid-template-columns:40px minmax(0,1fr) 70px}.team>button{grid-column:2/-1}.tb{grid-template-columns:repeat(2,minmax(0,1fr))}.tb button{grid-column:1/-1}
 .ctprow{grid-template-columns:40px minmax(0,1fr) 56px 56px}.ctprow .btns{grid-column:2/-1;display:flex;gap:8px}}
</style>
</head><body>
<header><h1>NYOT Scoring Table</h1><a href="../leaderboard/" target="_blank" rel="noopener">Open TV leaderboard</a><button class="ghost" id="out" hidden style="color:#fff;border-color:rgba(255,255,255,.5)">Sign out</button></header>
<main>
  <section class="card" id="login">
    <h2>Admin sign-in</h2>
    <p class="muted">Use the same admin email and password as the tournament app.</p>
    <form id="lf"><label for="em">Email</label><input type="email" id="em" autocomplete="username" required>
    <label for="pw" style="margin-top:10px">Password</label><input type="password" id="pw" autocomplete="current-password" required>
    <button style="margin-top:14px;width:100%">Sign in</button></form>
  </section>
  <div id="app" hidden>
    <div class="tabs"><button id="tab-cards" class="on" type="button">Scorecards</button><button id="tab-ctp" type="button">Closest to Pin</button><button id="tab-add" type="button">Add team</button></div>
    <section class="card" id="p-cards">
      <input type="text" id="q" placeholder="Search a name or hole number" aria-label="Search">
      <p class="muted" id="sum" style="margin:10px 0 0"></p>
      <div id="teams" style="margin-top:6px"></div>
    </section>
    <section class="card" id="p-ctp" hidden>
      <p class="muted" style="margin-top:0">Enter the closest player for each hole from the clipboards. Save replaces what's there.</p>
      <div id="ctps"></div>
    </section>
    <section class="card" id="p-add" hidden>
      <h2>Add a walk-up team</h2>
      <div class="row2"><div><label for="ah">Starting hole</label><select id="ah"></select></div>
      <div><label for="at">Team</label><select id="at"><option value="1">Team 1</option><option value="2">Team 2</option></select></div></div>
      <div class="row2" style="margin-top:10px"><div><label for="a1">Player 1</label><input type="text" id="a1"></div><div><label for="a2">Player 2</label><input type="text" id="a2"></div></div>
      <button id="addbtn" style="margin-top:14px;width:100%" type="button">Add team</button>
      <p class="muted">Walk-up teams show on the TV right away as "on the course".</p>
    </section>
  </div>
</main>
<div class="msg" id="msg" role="status"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { FB_CONFIG, EVENT_ID, HOLES, PAR, label, toPar, fmtDist, mergeTeams, standings } from '../live/common.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = initializeApp(FB_CONFIG), auth = getAuth(app), db = getFirestore(app);
const teamRef = id => doc(db, 'events', EVENT_ID, 'teams', id);
const ctpRef = n => doc(db, 'events', EVENT_ID, 'ctp', String(n));
let teamDocs = [], ctp = {}, unsubs = [], editing = false;

function toast(t, bad){ const m = $('msg'); m.textContent = t; m.className = 'msg show' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => m.className = 'msg', 2600); }
function fail(e){ console.error(e); toast(e && e.code === 'permission-denied' ? "Not saved: this account isn't allowed to change scores." : 'Not saved: ' + (e.message || e), true); }
const num = v => v === '' || v == null ? null : parseInt(v, 10);

$('lf').addEventListener('submit', e => { e.preventDefault(); signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value).catch(err => toast('Sign-in failed: check the email and password.', true)); });
$('out').onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  const ok = u && !u.isAnonymous;
  $('login').hidden = ok; $('app').hidden = !ok; $('out').hidden = !ok;
  unsubs.forEach(f => f()); unsubs = [];
  if(!ok) return;
  unsubs.push(onSnapshot(collection(db, 'events', EVENT_ID, 'teams'), s => { teamDocs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => d.id.startsWith('nyot-')); if(!editing) renderTeams(); }, fail));
  unsubs.push(onSnapshot(collection(db, 'events', EVENT_ID, 'ctp'), s => { ctp = {}; s.docs.forEach(d => ctp[d.id] = d.data()); if(!editing) renderCtp(); }, fail));
  renderTeams(); renderCtp();
});
document.addEventListener('focusin', e => { editing = !!e.target.closest('#teams,#ctps'); });
document.addEventListener('focusout', () => setTimeout(() => { if(!document.activeElement || !document.activeElement.closest('#teams,#ctps')){ editing = false; renderTeams(); renderCtp(); } }, 50));

['cards','ctp','add'].forEach(k => $('tab-' + k).onclick = () => { ['cards','ctp','add'].forEach(j => { $('p-' + j).hidden = j !== k; $('tab-' + j).classList.toggle('on', j === k); }); });

function renderTeams(){
  const all = mergeTeams(teamDocs); const { done } = standings(all);
  const q = $('q').value.trim().toLowerCase();
  $('sum').textContent = `${done.length} of ${all.length} cards entered`;
  const list = all.sort((a, b) => a.hole - b.hole || a.team - b.team).filter(t => !q || label(t).toLowerCase().includes(q) || String(t.hole) === q);
  $('teams').innerHTML = list.map(t => {
    const posted = t.posted && Number.isFinite(t.total);
    const same = posted && done.filter(o => o.total === t.total).length > 1;
    const unresolved = same && t.tied;
    const showTb = same || [t.b9, t.b6, t.b3, t.h18].some(v => v != null);
    const v = k => t[k] == null ? '' : t[k];
    return `<div class="team t${t.team} ${posted ? (unresolved ? 'tie' : 'posted') : ''}" data-id="${t.id}">
      <div class="hole">${t.hole}<small>T${t.team}</small></div>
      <div class="who"><b>${esc(label(t))}</b><span>${posted ? `Posted ${t.total} (${toPar(t.total)}) · place ${t.tied ? 'T' : ''}${t.rank}` : 'No card yet'}</span></div>
      <input type="number" inputmode="numeric" min="18" max="120" aria-label="Total for ${esc(label(t))}" value="${posted ? t.total : ''}" data-k="total">
      <button type="button" data-act="save">Save</button>
      ${unresolved ? `<div class="note">Tied on ${t.total}. Enter the tie-breaker totals from the card: holes 10–18, 13–18, 16–18, then hole 18.</div>` : ''}
      ${showTb ? `<div class="tb"><div><label>10–18</label><input type="number" inputmode="numeric" value="${v('b9')}" data-k="b9"></div><div><label>13–18</label><input type="number" inputmode="numeric" value="${v('b6')}" data-k="b6"></div><div><label>16–18</label><input type="number" inputmode="numeric" value="${v('b3')}" data-k="b3"></div><div><label>Hole 18</label><input type="number" inputmode="numeric" value="${v('h18')}" data-k="h18"></div><button type="button" data-act="save">Save</button></div>` : ''}
      ${posted ? `<button type="button" class="ghost" data-act="clear" style="grid-column:2/-1;justify-self:start;padding:6px 10px;font-size:13px">Remove this score</button>` : ''}
    </div>`;
  }).join('') || '<p class="muted">No teams match.</p>';
}
$('q').addEventListener('input', renderTeams);
$('teams').addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.matches('input')){ e.preventDefault(); e.target.closest('.team').querySelector('[data-act=save]').click(); } });
$('teams').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  const row = b.closest('.team'), id = row.dataset.id, t = mergeTeams(teamDocs).find(x => x.id === id);
  const base = { id, name: label(t), players: t.players, group: t.hole, team: t.team, scores: Array(18).fill(''), updatedAt: Date.now() };
  try{
    if(b.dataset.act === 'clear'){
      await setDoc(teamRef(id), { ...base, posted: false, total: null, b9: null, b6: null, b3: null, h18: null }, { merge: true });
      editing = false; renderTeams(); toast('Score removed'); return;
    }
    const get = k => { const i = row.querySelector(`[data-k=${k}]`); return i ? num(i.value) : (t[k] ?? null); };
    const total = get('total');
    if(!Number.isFinite(total) || total < 18 || total > 120){ toast('Enter the team total from the card (for example 52).', true); return; }
    await setDoc(teamRef(id), { ...base, posted: true, total, b9: get('b9'), b6: get('b6'), b3: get('b3'), h18: get('h18') }, { merge: true });
    editing = false; document.activeElement.blur?.(); renderTeams(); toast(`Saved: ${label(t)} ${total} (${toPar(total)})`);
  }catch(err){ fail(err); }
});

function renderCtp(){
  $('ctps').innerHTML = HOLES.map(h => {
    const c = ctp[h.n] || {}; const ft = c.inches != null ? Math.floor(c.inches / 12) : '', inch = c.inches != null ? Math.round(c.inches % 12) : '';
    return `<div class="ctprow" data-n="${h.n}"><div class="hole">${h.n}</div>
      <div><label>${esc(h.name)}${c.winner ? ' · now ' + esc(c.winner) + ' ' + fmtDist(c.inches) : ''}</label><input type="text" value="${esc(c.winner || '')}" data-k="w" placeholder="Player name"></div>
      <div><label>Feet</label><input type="number" inputmode="numeric" min="0" value="${ft}" data-k="ft"></div>
      <div><label>Inches</label><input type="number" inputmode="numeric" min="0" max="11" value="${inch}" data-k="in"></div>
      <div class="btns"><button type="button" data-act="save">Save</button>${c.winner ? '<button type="button" class="ghost" data-act="clear">Clear</button>' : ''}</div></div>`;
  }).join('');
}
$('ctps').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  const row = b.closest('.ctprow'), n = row.dataset.n;
  try{
    if(b.dataset.act === 'clear'){ await deleteDoc(ctpRef(n)); editing = false; renderCtp(); toast(`Hole ${n} cleared`); return; }
    const w = row.querySelector('[data-k=w]').value.trim(), ft = num(row.querySelector('[data-k=ft]').value) || 0, inch = num(row.querySelector('[data-k=in]').value) || 0;
    if(!w){ toast('Enter the player name.', true); return; }
    if(ft === 0 && inch === 0){ toast('Enter the distance in feet and inches.', true); return; }
    await setDoc(ctpRef(n), { winner: w, team: '', inches: ft * 12 + inch, time: Date.now() });
    editing = false; document.activeElement.blur?.(); renderCtp(); toast(`Hole ${n}: ${w} ${fmtDist(ft * 12 + inch)}`);
  }catch(err){ fail(err); }
});

$('ah').innerHTML = HOLES.map(h => `<option value="${h.n}" ${h.n === 16 ? 'selected' : ''}>Hole ${h.n} · ${esc(h.name)}</option>`).join('');
$('addbtn').onclick = async () => {
  const hole = +$('ah').value, team = +$('at').value, p = [$('a1').value.trim(), $('a2').value.trim()].filter(Boolean);
  if(!p.length){ toast('Enter at least one player name.', true); return; }
  const id = `nyot-h${String(hole).padStart(2, '0')}-t${team}`;
  const exists = mergeTeams(teamDocs).find(t => t.id === id && label(t) && label(t) !== 'Team');
  const fid = exists ? id + '-' + Date.now().toString(36) : id;
  try{
    await setDoc(teamRef(fid), { id: fid, name: p.join(' & '), players: p, group: hole, team, scores: Array(18).fill(''), posted: false, total: null, updatedAt: Date.now() });
    $('a1').value = ''; $('a2').value = ''; toast(`Added ${p.join(' & ')} on hole ${hole}`);
  }catch(err){ fail(err); }
};
</script>
</body></html>
